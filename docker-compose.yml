services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bazaar
      POSTGRES_PASSWORD: bazaar
      POSTGRES_DB: bazaar
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazaar -d bazaar"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bazaar:bazaar@postgres:5432/bazaar
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bazaar:bazaar@postgres:5432/bazaar
      PORT: "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    command: ["node", "dist/main.js"]

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bazaar:bazaar@postgres:5432/bazaar
      WORKER_PORT: "8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8001:8001"
    command: ["node", "dist/worker.js"]

volumes:
  pgdata:
